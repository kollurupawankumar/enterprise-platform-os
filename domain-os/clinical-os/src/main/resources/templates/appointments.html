<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments &amp; OPD Queue - Clinical OS Web Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="app-container">
        <!-- Reusable Left Sidebar -->
        <aside th:replace="~{fragments/nav :: sidebar('appointments')}"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Reusable Top Header -->
            <header th:replace="~{fragments/nav :: header('OPD Token Queue &amp; Appointment Scheduling')}"></header>

            <main class="content-container">
                <!-- Book Appointment Form -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Schedule OPD Appointment &amp; Issue Token</h2>
                    </div>
                    <form th:action="@{/appointments/book}" method="post" class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Select Patient</label>
                            <select name="patientId" class="form-control" required>
                                <option th:each="p : ${patients}" th:value="${p.patientId}" th:text="${p.firstName + ' ' + (p.lastName != null ? p.lastName : '') + ' (' + p.patientId + ')'}">Patient</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Consulting Doctor</label>
                            <select name="doctorName" class="form-control">
                                <option value="Dr. Suresh Kumar (Cardiology)">Dr. Suresh Kumar (Cardiology)</option>
                                <option value="Dr. Ananya Sharma (General Medicine)">Dr. Ananya Sharma (General Medicine)</option>
                                <option value="Dr. Rajesh Patel (Pediatrics)">Dr. Rajesh Patel (Pediatrics)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Slot Time</label>
                            <input type="text" name="appointmentTime" class="form-control" value="10:30 AM" required>
                        </div>
                        <div class="form-group align-end">
                            <button type="submit" class="btn btn-primary w-100">📅 Issue Token &amp; Schedule</button>
                        </div>
                    </form>
                </div>

                <!-- Appointment List Table -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Scheduled OPD Appointments Queue</h2>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Token #</th>
                                    <th>Patient ID / Name</th>
                                    <th>Consulting Doctor</th>
                                    <th>Scheduled Time</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="apt : ${appointments}">
                                    <td><strong class="text-primary" th:text="${apt.tokenNumber != null ? '#' + apt.tokenNumber : '#101'}">#101</strong></td>
                                    <td><strong th:text="${apt.patientName}">Rajesh Sharma</strong></td>
                                    <td th:text="${apt.doctorName}">Dr. Suresh Kumar</td>
                                    <td th:text="${apt.slotTime}">09:00 AM</td>
                                    <td>
                                        <span class="badge badge-warning" th:text="${apt.status}">BOOKED</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/billing}" class="btn btn-primary btn-sm">Bill &amp; Pay</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(appointments)}">
                                    <td colspan="6" class="table-empty">No appointments scheduled today.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
