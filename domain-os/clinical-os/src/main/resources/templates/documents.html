<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EMR Document Vault - Clinical OS Web Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="app-container">
        <!-- Reusable Left Sidebar -->
        <aside th:replace="~{fragments/nav :: sidebar('documents')}"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Reusable Top Header -->
            <header th:replace="~{fragments/nav :: header('Digital EMR Patient Document Cabinet')}"></header>

            <main class="content-container">
                <!-- Document Vault List Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Attached Medical Records &amp; Diagnostic Reports</h2>
                        <form th:action="@{/documents}" method="get" class="search-form">
                            <input type="text" name="query" class="form-control" placeholder="Search Patient ID, Document..." th:value="${query}">
                            <button type="submit" class="btn btn-primary">Search</button>
                        </form>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Document ID</th>
                                    <th>Patient ID</th>
                                    <th>Document Name</th>
                                    <th>Category Type</th>
                                    <th>File Format</th>
                                    <th>Uploaded At</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="doc : ${documents}">
                                    <td><strong class="text-primary" th:text="${doc.documentId}">DOC-1001</strong></td>
                                    <td th:text="${doc.patientId}">PAT-1001</td>
                                    <td><strong th:text="${doc.documentName}">Chest X-Ray Scan.pdf</strong></td>
                                    <td><span class="badge badge-warning" th:text="${doc.documentType != null ? doc.documentType : 'X-RAY'}">X-RAY</span></td>
                                    <td th:text="${doc.fileExtension != null ? doc.fileExtension : 'PDF'}">PDF</td>
                                    <td th:text="${doc.createdAt}">2026-08-15</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(documents)}">
                                    <td colspan="6" class="table-empty">No EMR patient documents uploaded yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
