<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clinic Settings - Clinical OS Web Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div style="display: flex; min-height: 100vh;">
        <!-- Reusable Left Sidebar -->
        <aside th:replace="~{fragments/nav :: sidebar('settings')}"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Reusable Top Header -->
            <header th:replace="~{fragments/nav :: header('Clinic Organization &amp; Header Branding Settings')}"></header>

            <main class="content-container">
                <!-- Clinic Details Form Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Clinic Profile &amp; Prescription Branding</h2>
                    </div>
                    <form th:action="@{/settings/save}" method="post" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem;">
                        <div>
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Clinic / Hospital Name</label>
                            <input type="text" name="clinicName" class="form-control" th:value="${clinicName}" required>
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Medical License / Reg No</label>
                            <input type="text" name="registrationNumber" class="form-control" th:value="${registrationNumber}">
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Primary Contact Phone</label>
                            <input type="text" name="contactPhone" class="form-control" th:value="${contactPhone}">
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Clinic Email Address</label>
                            <input type="email" name="contactEmail" class="form-control" th:value="${contactEmail}">
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Full Clinic Street Address</label>
                            <input type="text" name="address" class="form-control" th:value="${address}">
                        </div>
                        <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end;">
                            <button type="submit" class="btn btn-primary">💾 Save Clinic Settings</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
