<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clinic Settings - Clinical OS Web Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="app-container">
        <!-- Reusable Left Sidebar -->
        <aside th:replace="~{fragments/nav :: sidebar('settings')}"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Reusable Top Header -->
            <header th:replace="~{fragments/nav :: header('Clinic Organization &amp; Header Branding Settings')}"></header>

            <main class="content-container">
                <!-- Clinic Details Form Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Clinic Profile &amp; Prescription Branding</h2>
                    </div>
                    <form th:action="@{/settings/save}" method="post" class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Clinic / Hospital Name</label>
                            <input type="text" name="clinicName" class="form-control" th:value="${clinicName}" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Medical License / Reg No</label>
                            <input type="text" name="registrationNumber" class="form-control" th:value="${registrationNumber}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Primary Contact Phone</label>
                            <input type="text" name="contactPhone" class="form-control" th:value="${contactPhone}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Clinic Email Address</label>
                            <input type="email" name="contactEmail" class="form-control" th:value="${contactEmail}">
                        </div>
                        <div class="form-group col-span-full">
                            <label class="form-label">Full Clinic Street Address</label>
                            <input type="text" name="address" class="form-control" th:value="${address}">
                        </div>
                        <div class="form-group col-span-full d-flex align-end">
                            <button type="submit" class="btn btn-primary">💾 Save Clinic Settings</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
