<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients Directory - Clinical OS Web Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="app-container">
        <!-- Reusable Left Sidebar -->
        <aside th:replace="~{fragments/nav :: sidebar('patients')}"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Reusable Top Header -->
            <header th:replace="~{fragments/nav :: header('Master Patient Registry')}"></header>

            <main class="content-container">
                <!-- Registration Form Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Quick Patient Onboarding</h2>
                    </div>
                    <form th:action="@{/patients/register}" method="post" class="form-grid">
                        <div class="form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" name="firstName" class="form-control" placeholder="First Name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" name="lastName" class="form-control" placeholder="Last Name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Gender</label>
                            <select name="gender" class="form-control">
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" name="dob" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Mobile Number</label>
                            <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210" required>
                        </div>
                        <div class="form-group align-end">
                            <button type="submit" class="btn btn-primary w-100">+ Register Patient</button>
                        </div>
                    </form>
                </div>

                <!-- Patient List Table Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Registered Patient Database</h2>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Patient ID</th>
                                    <th>Full Name</th>
                                    <th>Gender / DOB</th>
                                    <th>Phone Number</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="patient : ${patients}">
                                    <td><strong class="text-primary" th:text="${patient.patientId}">PAT-1001</strong></td>
                                    <td><strong th:text="${patient.firstName + ' ' + (patient.lastName != null ? patient.lastName : '')}">John Doe</strong></td>
                                    <td th:text="${(patient.gender != null ? patient.gender : 'N/A') + ' / ' + (patient.dob != null ? patient.dob : 'N/A')}">MALE / 1990-05-12</td>
                                    <td th:text="${patient.phone}">+91 98765 43210</td>
                                    <td>
                                        <a th:href="@{/appointments}" class="btn btn-primary btn-sm">Book OPD Slot</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(patients)}">
                                    <td colspan="5" class="table-empty">No registered patients found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
