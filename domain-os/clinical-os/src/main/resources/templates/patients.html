<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients Directory - Clinical OS Web Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="app-container">
        <!-- Reusable Left Sidebar -->
        <aside th:replace="~{fragments/nav :: sidebar('patients')}"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Reusable Top Header -->
            <header th:replace="~{fragments/nav :: header('Master Patient Registry')}"></header>

            <main class="content-container">
                <!-- 2-Tab Registration Form Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Patient Onboarding &amp; Registration</h2>
                    </div>

                    <form th:action="@{/patients/register}" method="post">
                        <!-- Tab Header Buttons -->
                        <div class="tab-nav">
                            <button type="button" class="tab-btn active" onclick="switchTab('tab-personal', this)">
                                👤 1. Personal Details &amp; Contact
                            </button>
                            <button type="button" class="tab-btn" onclick="switchTab('tab-address', this)">
                                🏠 2. Address, Emergency &amp; Medical History
                            </button>
                        </div>

                        <!-- TAB 1: Personal Details -->
                        <div id="tab-personal" class="tab-pane active">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label class="form-label">Patient Category</label>
                                    <select name="patientType" class="form-control">
                                        <option value="NEW">New General Patient</option>
                                        <option value="REGULAR">Regular Patient</option>
                                        <option value="VIP">VIP / Priority Patient</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">First Name *</label>
                                    <input type="text" name="firstName" class="form-control" placeholder="First Name" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Last Name *</label>
                                    <input type="text" name="lastName" class="form-control" placeholder="Last Name" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Gender *</label>
                                    <select name="gender" class="form-control">
                                        <option value="MALE">Male</option>
                                        <option value="FEMALE">Female</option>
                                        <option value="OTHER">Other</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Date of Birth</label>
                                    <input type="date" name="dob" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Primary Mobile Number *</label>
                                    <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Alternate Phone</label>
                                    <input type="text" name="alternatePhone" class="form-control" placeholder="Alternate Mobile">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" name="email" class="form-control" placeholder="patient@example.com">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Government Identity Type</label>
                                    <select name="identityType" class="form-control">
                                        <option value="AADHAAR">Aadhaar Card</option>
                                        <option value="PASSPORT">Passport</option>
                                        <option value="VOTER_ID">Voter ID</option>
                                        <option value="DRIVING_LICENSE">Driving License</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Identity ID Number</label>
                                    <input type="text" name="identityNumber" class="form-control" placeholder="e.g. 1234-5678-9012">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Marital Status</label>
                                    <select name="maritalStatus" class="form-control">
                                        <option value="SINGLE">Single</option>
                                        <option value="MARRIED">Married</option>
                                        <option value="OTHER">Other</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Occupation</label>
                                    <input type="text" name="occupation" class="form-control" placeholder="e.g. Software Engineer">
                                </div>
                            </div>

                            <div class="form-group d-flex justify-content-between align-end" style="margin-top: 1.5rem;">
                                <span></span>
                                <button type="button" class="btn btn-primary" onclick="switchTab('tab-address', document.querySelectorAll('.tab-btn')[1])">Next: Address &amp; History ➔</button>
                            </div>
                        </div>

                        <!-- TAB 2: Address, Emergency & Medical History -->
                        <div id="tab-address" class="tab-pane">
                            <div class="form-grid">
                                <div class="form-group col-span-full">
                                    <label class="form-label">Residential Address Line 1</label>
                                    <input type="text" name="address" class="form-control" placeholder="House / Flat No, Building Name, Street">
                                </div>
                                <div class="form-group col-span-full">
                                    <label class="form-label">Address Line 2 / Landmark</label>
                                    <input type="text" name="addressLine2" class="form-control" placeholder="Area, Landmark">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">City</label>
                                    <input type="text" name="city" class="form-control" placeholder="City">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">State</label>
                                    <input type="text" name="state" class="form-control" placeholder="State">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Pincode</label>
                                    <input type="text" name="pincode" class="form-control" placeholder="500001">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Emergency Contact Name</label>
                                    <input type="text" name="emergencyContactName" class="form-control" placeholder="Contact Person">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Emergency Relationship</label>
                                    <input type="text" name="emergencyRelationship" class="form-control" placeholder="e.g. Spouse / Parent">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Emergency Phone Number</label>
                                    <input type="text" name="emergencyContactPhone" class="form-control" placeholder="+91 98765 43210">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Allergies Status</label>
                                    <select name="knownAllergiesStatus" class="form-control">
                                        <option value="NO_KNOWN_ALLERGIES">No Known Allergies (NKDA)</option>
                                        <option value="ALLERGIES_PRESENT">Allergies Present</option>
                                        <option value="UNKNOWN">Unknown / Not Tested</option>
                                    </select>
                                </div>
                                <div class="form-group col-span-full">
                                    <label class="form-label">Specific Drug / Medical Allergies</label>
                                    <input type="text" name="allergies" class="form-control" placeholder="e.g. Penicillin, Sulfa drugs, Peanuts">
                                </div>
                            </div>

                            <div class="form-group d-flex justify-content-between align-end" style="margin-top: 1.5rem;">
                                <button type="button" class="btn btn-logout" onclick="switchTab('tab-personal', document.querySelectorAll('.tab-btn')[0])">⬅️ Back to Personal Details</button>
                                <button type="submit" class="btn btn-success">+ Complete Full Patient Onboarding</button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Patient List Table Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Registered Patient Database</h2>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Patient ID</th>
                                    <th>Full Name</th>
                                    <th>Gender / DOB</th>
                                    <th>Phone Number</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="patient : ${patients}">
                                    <td><strong class="text-primary" th:text="${patient.patientId}">PAT-1001</strong></td>
                                    <td><strong th:text="${patient.firstName + ' ' + (patient.lastName != null ? patient.lastName : '')}">John Doe</strong></td>
                                    <td th:text="${(patient.gender != null ? patient.gender : 'N/A') + ' / ' + (patient.dob != null ? patient.dob : 'N/A')}">MALE / 1990-05-12</td>
                                    <td th:text="${patient.phone}">+91 98765 43210</td>
                                    <td>
                                        <a th:href="@{/appointments}" class="btn btn-primary btn-sm">Book OPD Slot</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(patients)}">
                                    <td colspan="5" class="table-empty">No registered patients found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Client-side Tab Switcher Script -->
    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }
    </script>

</body>
</html>
