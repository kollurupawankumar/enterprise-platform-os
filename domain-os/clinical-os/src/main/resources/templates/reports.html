<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Practice Analytics - Clinical OS Web Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="app-container">
        <!-- Reusable Left Sidebar -->
        <aside th:replace="~{fragments/nav :: sidebar('reports')}"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Reusable Top Header -->
            <header th:replace="~{fragments/nav :: header('Practice Revenue Analytics &amp; Day-End Cash Register')}"></header>

            <main class="content-container">
                <!-- Summary KPI Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">💰</div>
                        <div class="stat-info">
                            <h3>Total Revenue Realized</h3>
                            <div class="value" th:text="${formattedTotalRevenue}">₹1,45,800</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">🩺</div>
                        <div class="stat-info">
                            <h3>Consultation Fees</h3>
                            <div class="value" th:text="${formattedConsultationRevenue}">₹85,000</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">💊</div>
                        <div class="stat-info">
                            <h3>Pharmacy Sales</h3>
                            <div class="value" th:text="${formattedPharmacyRevenue}">₹42,300</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">🔬</div>
                        <div class="stat-info">
                            <h3>Lab Test Collections</h3>
                            <div class="value" th:text="${formattedLabRevenue}">₹18,500</div>
                        </div>
                    </div>
                </div>

                <!-- Export & Print Actions Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Generate Statutory Practice Reports</h2>
                    </div>
                    <div class="d-flex" style="gap: 1rem; flex-wrap: wrap;">
                        <button class="btn btn-primary" onclick="window.print();">🖨️ Print Day-End Settlement Summary</button>
                        <button class="btn btn-success" onclick="alert('Exporting Practice Audit Report to CSV...');">📊 Export Audit Log (CSV)</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
