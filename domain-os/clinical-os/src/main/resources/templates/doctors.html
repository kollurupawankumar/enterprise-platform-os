<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Roster &amp; Onboarding - Clinical OS Web Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="app-container">
        <!-- Reusable Left Sidebar -->
        <aside th:replace="~{fragments/nav :: sidebar('doctors')}"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Reusable Top Header -->
            <header th:replace="~{fragments/nav :: header('Doctor Roster &amp; Medical Practitioner Onboarding')}"></header>

            <main class="content-container">
                <!-- Add Doctor Form Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Onboard New Medical Practitioner</h2>
                    </div>
                    <form th:action="@{/doctors/register}" method="post" class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Doctor Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Dr. Ananya Sharma" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Specialization</label>
                            <input type="text" name="specialization" class="form-control" placeholder="e.g. Cardiology / General Medicine" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Qualification</label>
                            <input type="text" name="qualification" class="form-control" placeholder="e.g. MBBS, MD (Medicine)" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Medical License No</label>
                            <input type="text" name="licenseNumber" class="form-control" placeholder="e.g. MCI-2026-8801" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210" required>
                        </div>
                        <div class="form-group align-end">
                            <button type="submit" class="btn btn-primary w-100">🩺 Register Doctor</button>
                        </div>
                    </form>
                </div>

                <!-- Doctors List Table Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Medical Specialists &amp; On-Call Practitioners</h2>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Doctor ID</th>
                                    <th>Doctor Name</th>
                                    <th>Specialization</th>
                                    <th>Qualifications</th>
                                    <th>License #</th>
                                    <th>Contact Phone</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="doc : ${doctors}">
                                    <td><strong class="text-primary" th:text="${doc.doctorId}">DOC-1001</strong></td>
                                    <td><strong th:text="${doc.name != null ? doc.name : doc.firstName + ' ' + (doc.lastName != null ? doc.lastName : '')}">Dr. Pawan Kumar</strong></td>
                                    <td><span class="badge badge-success" th:text="${doc.specialization != null ? doc.specialization : 'General Physician'}">General Physician</span></td>
                                    <td th:text="${doc.qualification != null ? doc.qualification : 'MBBS, MD'}">MBBS, MD</td>
                                    <td th:text="${doc.licenseNumber != null ? doc.licenseNumber : 'MCI-88901'}">MCI-88901</td>
                                    <td th:text="${doc.phone}">+91 98765 43210</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(doctors)}">
                                    <td colspan="6" class="table-empty">No medical practitioners registered.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
