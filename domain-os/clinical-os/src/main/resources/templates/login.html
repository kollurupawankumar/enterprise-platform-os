<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Practitioner Login - Clinical OS Web Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc;">

    <div style="width: 100%; max-width: 420px; padding: 2rem; background: #ffffff; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-md); text-align: center;">
        <div style="margin-bottom: 1.5rem;">
            <h1 style="color: var(--primary-color); font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem;">Clinical OS</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Enterprise Clinical &amp; Practice Management Platform</p>
        </div>

        <form th:action="@{/login}" method="post" style="display: flex; flex-direction: column; gap: 1.25rem; text-align: left;">
            <div>
                <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Doctor / Staff Username</label>
                <input type="text" name="username" class="form-control" value="dr.pawan" placeholder="Username" required>
            </div>
            <div>
                <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Password</label>
                <input type="password" name="password" class="form-control" value="password123" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="padding: 0.75rem; justify-content: center; width: 100%; font-size: 1rem; margin-top: 0.5rem;">
                🔓 Secure Practitioner Sign In
            </button>
        </form>

        <div style="margin-top: 1.5rem; font-size: 0.75rem; color: var(--text-muted);">
            Protected by Clinical OS Security Shield v1.0
        </div>
    </div>

</body>
</html>
