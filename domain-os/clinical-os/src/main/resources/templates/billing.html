<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Master POS Billing - Clinical OS Web Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div style="display: flex; min-height: 100vh;">
        <!-- Reusable Left Sidebar -->
        <aside th:replace="~{fragments/nav :: sidebar('billing')}"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Reusable Top Header -->
            <header th:replace="~{fragments/nav :: header('Master OPD POS Billing Workstation')}"></header>

            <main class="content-container">
                <!-- Create Bill Form Card -->
                <div class="data-card" style="margin-bottom: 1.5rem;">
                    <div class="card-header">
                        <h2>Generate Consolidated OPD Invoice</h2>
                    </div>
                    <form th:action="@{/billing/create}" method="post" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                        <div>
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Select Patient</label>
                            <select name="patientId" class="form-control" required>
                                <option th:each="p : ${patients}" th:value="${p.patientId}" th:text="${p.firstName + ' ' + (p.lastName != null ? p.lastName : '') + ' (' + p.patientId + ')'}">Patient</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Consultation Fee (₹)</label>
                            <input type="number" step="0.01" name="consultationFee" class="form-control" value="500.00" required>
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Lab Tests Fee (₹)</label>
                            <input type="number" step="0.01" name="labFee" class="form-control" value="0.00">
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Pharmacy Medicines Fee (₹)</label>
                            <input type="number" step="0.01" name="pharmacyFee" class="form-control" value="0.00">
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; color: var(--text-muted);">Payment Mode</label>
                            <select name="paymentMode" class="form-control">
                                <option value="CASH">Cash</option>
                                <option value="UPI">UPI / QR Code</option>
                                <option value="CARD">Credit / Debit Card</option>
                            </select>
                        </div>
                        <div style="display: flex; align-items: flex-end;">
                            <button type="submit" class="btn btn-success" style="width: 100%;">💳 Generate &amp; Pay Bill</button>
                        </div>
                    </form>
                </div>

                <!-- Invoices Table Card -->
                <div class="data-card">
                    <div class="card-header">
                        <h2>Generated Invoices &amp; Realized Revenue</h2>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Invoice #</th>
                                    <th>Patient ID</th>
                                    <th>Consultation</th>
                                    <th>Lab Fee</th>
                                    <th>Pharmacy</th>
                                    <th>Total Net Amount</th>
                                    <th>Payment Mode</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="inv : ${invoices}">
                                    <td><strong style="color:var(--primary-color);" th:text="${inv.invoiceId}">INV-1001</strong></td>
                                    <td th:text="${inv.patientId}">PAT-1001</td>
                                    <td th:text="${'₹' + inv.consultationFee}">₹500.00</td>
                                    <td th:text="${'₹' + inv.labFee}">₹0.00</td>
                                    <td th:text="${'₹' + inv.pharmacyFee}">₹0.00</td>
                                    <td><strong style="color:var(--success-color);" th:text="${'₹' + inv.totalAmount}">₹500.00</strong></td>
                                    <td th:text="${inv.paymentMode}">CASH</td>
                                    <td>
                                        <span class="badge badge-success" th:text="${inv.paymentStatus}">PAID</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(invoices)}">
                                    <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 2rem;">No OPD invoices generated yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
