<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Medicine Item - Clinical OS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="app-container">
        <!-- Reusable Left Sidebar Navigation -->
        <aside th:replace="~{fragments/nav :: sidebar('pharmacy-add')}"></aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Reusable Top Header -->
            <header th:replace="~{fragments/nav :: header('Add New Medication to Pharmacy Inventory')}"></header>

            <main class="content-container">
                <div class="data-card">
                    <div class="card-header">
                        <h2>Add Medication &amp; Batch Stock</h2>
                        <a th:href="@{/pharmacy}" class="btn btn-logout">⬅️ Return to Inventory Stock</a>
                    </div>

                    <form th:action="@{/pharmacy/add}" method="post">
                        <div class="form-section-card">
                            <div class="section-title">💊 Medication Details &amp; Stock Quantities</div>
                            <div class="form-grid-3">
                                <div class="form-group">
                                    <label class="form-label">Medicine Brand Name &amp; Strength *</label>
                                    <input type="text" name="medicineName" class="form-control" placeholder="e.g. Tab. Paracetamol 650mg" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Therapeutic Category *</label>
                                    <select name="category" class="form-control" required>
                                        <option value="Analgesic / Antipyretic">Analgesic / Antipyretic</option>
                                        <option value="Antibiotics">Antibiotics</option>
                                        <option value="Antihypertensive">Antihypertensive</option>
                                        <option value="Antidiabetic">Antidiabetic</option>
                                        <option value="Cough &amp; Cold Syrups">Cough &amp; Cold Syrups</option>
                                        <option value="Vitamins &amp; Supplements">Vitamins &amp; Supplements</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Initial Stock Quantity (Units) *</label>
                                    <input type="number" name="stockQuantity" class="form-control" placeholder="e.g. 500" value="500" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Unit Selling Price (₹) *</label>
                                    <input type="number" step="0.01" name="unitPrice" class="form-control" placeholder="e.g. 2.50" value="2.50" required>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="form-group col-span-full d-flex justify-content-between align-end" style="margin-top: 1.5rem;">
                            <a th:href="@{/pharmacy}" class="btn btn-logout">⬅️ Cancel &amp; Return to Inventory</a>
                            <button type="submit" class="btn btn-success" style="padding: 0.75rem 1.75rem;">💊 Save Medication Item</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
