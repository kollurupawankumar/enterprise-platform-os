server:
  port: 8081

app:
  database:
    path: database/society.db
  version: 1.0.0

spring:
  main:
    web-application-type: servlet
  application:
    name: Society Office OS

  datasource:
    url: jdbc:sqlite:${app.database.path}?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG