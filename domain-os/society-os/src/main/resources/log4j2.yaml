Configuration:
  status: INFO
  name: EnterpriseLog4j2YAMLConfig
  Properties:
    Property:
      - name: LOG_PATTERN
        value: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
      - name: LOG_DIR
        value: "logs"

  Appenders:
    Console:
      name: ConsoleAppender
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "${LOG_PATTERN}"

    RollingFile:
      - name: AppFileAppender
        fileName: "${LOG_DIR}/society-os.log"
        filePattern: "${LOG_DIR}/archived/society-os-%d{yyyy-MM-dd}-%i.log.gz"
        PatternLayout:
          pattern: "${LOG_PATTERN}"
        Policies:
          TimeBasedTriggeringPolicy:
            interval: 1
            modulate: true
          SizeBasedTriggeringPolicy:
            size: "10 MB"
        DefaultRolloverStrategy:
          max: 30

      - name: AuditFileAppender
        fileName: "${LOG_DIR}/audit.log"
        filePattern: "${LOG_DIR}/archived/audit-%d{yyyy-MM-dd}-%i.log.gz"
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} [AUDIT] %msg%n"
        Policies:
          TimeBasedTriggeringPolicy:
            interval: 1
            modulate: true
          SizeBasedTriggeringPolicy:
            size: "10 MB"
        DefaultRolloverStrategy:
          max: 90

  Loggers:
    Logger:
      - name: com.society
        level: DEBUG
        additivity: false
        AppenderRef:
          - ref: ConsoleAppender
          - ref: AppFileAppender

      - name: com.core.os
        level: DEBUG
        additivity: false
        AppenderRef:
          - ref: ConsoleAppender
          - ref: AppFileAppender

      - name: com.core.os.audit
        level: INFO
        additivity: false
        AppenderRef:
          - ref: AuditFileAppender
          - ref: ConsoleAppender

    Root:
      level: INFO
      AppenderRef:
        - ref: ConsoleAppender
        - ref: AppFileAppender
